plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'java'
}

group = 'com'
version = '7.7.11'

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = "spigotmc"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "EcoItems"
        url = "https://repo.auxilor.io/repository/maven-public/"
    }
    maven {
        url = 'https://jitpack.io'
    }
    maven {
        url = 'https://libraries.minecraft.net/'
    }
    maven {
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven {
        name = 'MorePaperLib'
        url = 'https://mvn-repo.arim.space/lesser-gpl3/'
    }
    maven {
        url = "https://repo.codemc.org/repository/maven-public/"
    }
    maven {
        name = "MMOItems"
        url = 'https://nexus.phoenixdevt.fr/repository/maven-public/'
    }
    maven {
        name = "ItemsAdder"
        url = 'https://maven.devs.beer/'
    }
    maven {
        name = "Oraxen"
        url = "https://repo.oraxen.com/releases"
    }
    maven {
        name = "NeigeItems"
        url = "https://r.irepo.space/maven/"
    }
}

dependencies {
    compileOnly "org.spigotmc:spigot-api:1.18.1-R0.1-SNAPSHOT"
    compileOnly "org.spigotmc:spigot-api:1.14.4-R0.1-SNAPSHOT"
    compileOnly "com.github.MilkBowl:VaultAPI:1.7"
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'me.clip:placeholderapi:2.11.5'
    compileOnly 'org.xerial:sqlite-jdbc:3.32.3.1'
    compileOnly 'com.mojang:authlib:1.5.25'
    implementation project(":api")
    implementation files('libs/item-nbt-api-2.16.1.jar')
    implementation 'space.arim.morepaperlib:morepaperlib:0.4.4'
    implementation 'com.zaxxer:HikariCP:4.0.3'
    implementation 'commons-io:commons-io:2.6'
    implementation 'net.jpountz.lz4:lz4:1.3.0'
    implementation 'org.slf4j:slf4j-nop:1.7.36'
    implementation "com.google.code.gson:gson:2.14.0"
    implementation 'net.kyori:adventure-text-minimessage:4.17.0'
    implementation 'net.kyori:adventure-text-serializer-legacy:4.17.0'
}

shadowJar {
    destinationDirectory = file('OutPut')
    archiveClassifier.set('')
    configurations = [project.configurations.runtimeClasspath]
    relocate 'net.jpountz', 'com.playerinv.dependencies.lz4.net.jpountz'
    relocate 'org.lz4', 'com.playerinv.dependencies.lz4.org.lz4'

    relocate 'com.google.gson',
            'com.playerinv.dependencies.gson'

    relocate 'net.kyori',
            'com.playerinv.dependencies.kyori'

    relocate 'com.zaxxer.hikari',
            'com.playerinv.dependencies.hikari'

    relocate 'org.slf4j',
            'com.playerinv.dependencies.slf4j'

    relocate 'org.apache.commons.io',
            'com.playerinv.dependencies.commonsio'

    relocate 'de.tr7zw.changeme.nbtapi',
            'com.playerinv.dependencies.nbtapi'

    relocate 'space.arim.morepaperlib',
            'com.playerinv.dependencies.morepaperlib'
}


def targetJavaVersion = 1.8
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

